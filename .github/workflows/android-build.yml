name: Android CI

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Huawei-compatible APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Test and assemble
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Verify no Google-only runtime dependency
        working-directory: android
        shell: bash
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > dependency-report.txt
          if grep -E "com\.google\.android\.gms|com\.google\.firebase" dependency-report.txt; then
            echo "Google-only dependency detected; Huawei compatibility check failed."
            exit 1
          fi

      - name: Upload Huawei-compatible debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-first-driving-assistant-huawei-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
